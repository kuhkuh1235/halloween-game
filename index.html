
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 Haunted Halloween</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  color: white;
  font-family: "Trebuchet MS", sans-serif;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 25%, #51206e 0%, transparent 35%),
    linear-gradient(#090719, #180b2d 55%, #080b16);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;
  background-image:
    radial-gradient(2px 2px at 20% 30%, white 50%, transparent),
    radial-gradient(2px 2px at 70% 15%, #ffb84d 50%, transparent),
    radial-gradient(2px 2px at 85% 60%, white 50%, transparent),
    radial-gradient(2px 2px at 35% 75%, #c9a5ff 50%, transparent);
  background-size: 180px 150px;
  animation: stars 5s linear infinite alternate;
}

@keyframes stars {
  from { opacity: .2; }
  to { opacity: .65; }
}

.moon {
  position: fixed;
  top: 65px;
  right: 12%;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #fff0b2;
  box-shadow: 0 0 35px #ffdc8b, 0 0 100px #a56cff66;
}

h1 {
  position: relative;
  margin: 36px 12px 8px;
  font-size: clamp(2.2rem, 7vw, 4.8rem);
  color: #ff9d27;
  text-shadow: 0 0 12px #ff5c00, 0 0 35px #a62aff;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  to { text-shadow: 0 0 22px #ff6a00, 0 0 55px #a62aff; }
}

.subtitle {
  color: #e1ccff;
  font-size: 1.1rem;
}

.scene {
  position: relative;
  margin: 24px auto;
  width: min(92%, 650px);
  height: 150px;
  overflow: hidden;
  border-bottom: 4px solid #59306e;
  border-radius: 12px;
  background: linear-gradient(transparent, #100c22);
}

.house {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 100px;
  filter: drop-shadow(0 0 18px #9b3bff);
}

.bat {
  position: absolute;
  font-size: 28px;
  animation: fly 7s linear infinite;
}

.bat:nth-child(1) { top: 20px; animation-delay: -2s; }
.bat:nth-child(2) { top: 65px; animation-delay: -5s; }

@keyframes fly {
  from { left: -50px; }
  to { left: 105%; }
}

.panel {
  position: relative;
  margin: 20px auto;
  width: min(92%, 650px);
  padding: 20px;
  border: 1px solid #8c4bba;
  border-radius: 20px;
  background: #160d2bd9;
  box-shadow: 0 0 30px #7028a833;
}

button {
  margin: 6px;
  padding: 12px 20px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff8a00, #ff3d71);
  color: white;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #ff5a2766;
}

button:hover { transform: scale(1.05); }

#game {
  display: block;
  width: 100%;
  max-width: 560px;
  height: auto;
  margin: 16px auto;
  border: 2px solid #8d50bd;
  border-radius: 12px;
  background: linear-gradient(#17132f, #301344 75%, #101021);
  touch-action: none;
}

#status {
  color: #ffd580;
  font-size: 1.15rem;
}

.controls { margin-top: 8px; }
footer {
  padding: 25px 12px;
  color: #bda9d8;
}

.fall {
  position: fixed;
  top: -40px;
  z-index: -1;
  animation: fall 9s linear infinite;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}
</style>
</head>

<body>
<div class="moon"></div>
<div class="fall" style="left:8%;animation-delay:-2s">🎃</div>
<div class="fall" style="left:82%;animation-delay:-6s">🦇</div>

<h1>🎃 HAUNTED HALLOWEEN 👻</h1>
<p class="subtitle">Välkommen till den hemsökta natten...</p>

<div class="scene">
  <span class="bat">🦇</span>
  <span class="bat">🦇</span>
  <div class="house">🏚️</div>
</div>

<div class="panel">
  <h2>👻 Samla godis – överlev natten!</h2>
  <p>Samla 🍬 och undvik 👻. Hur många poäng klarar du?</p>
  <p id="status">Redo för en kuslig utmaning?</p>

  <canvas id="game" width="560" height="300"></canvas>

  <button id="start">▶ Starta spelet</button>
  <button id="music">🔊 Starta musik</button>

  <div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>
  <p>Tips: använd piltangenterna eller knapparna!</p>
</div>

<footer>
  🕸️ Trick or Treat! 🕸️<br>
  <small>Made for the bravest Halloween hunters 🎃</small>
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let player, items, score, running, frame, keys;
let audio, musicTimer, musicOn = false;

function resetGame() {
  player = { x: 260, y: 245, w: 38, speed: 5 };
  items = [];
  score = 0;
  frame = 0;
  keys = {};
}

resetGame();

function drawEmoji(emoji, x, y, size = 30) {
  ctx.font = size + "px serif";
  ctx.textAlign = "center";
  ctx.fillText(emoji, x, y);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Stjärnhimmel
  for (let i = 0; i < 35; i++) {
    const x = (i * 97) % canvas.width;
    const y = (i * 47) % 170;
    ctx.fillStyle = "#ffffff88";
    ctx.fillRect(x, y, 2, 2);
  }

  // Måne
  ctx.fillStyle = "#ffe8a3";
  ctx.beginPath();
  ctx.arc(475, 48, 25, 0, Math.PI * 2);
  ctx.fill();

  // Kusligt hus
  drawEmoji("🏚️", 100, 130, 65);
  drawEmoji("🌲", 500, 170, 65);

  // Mark
  ctx.fillStyle = "#241036";
  ctx.fillRect(0, 270, 560, 30);

  drawEmoji("🧙", player.x, player.y, 38);

  items.forEach(item => drawEmoji(item.type, item.x, item.y, 28));

  ctx.fillStyle = "white";
  ctx.textAlign = "left";
  ctx.font = "bold 17px sans-serif";
  ctx.fillText("🍬 Poäng: " + score, 12, 24);

  if (!running) {
    ctx.fillStyle = "#0a0618bb";
    ctx.fillRect(0, 0, 560, 300);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffb84d";
    ctx.font = "bold 27px sans-serif";
    ctx.fillText("HAUNTED NIGHT", 280, 130);
    ctx.fillStyle = "white";
    ctx.font = "17px sans-serif";
    ctx.fillText("Tryck på Starta spelet!", 280, 165);
  }
}

function spawnItem() {
  items.push({
    x: 20 + Math.random() * 520,
    y: -20,
    type: Math.random() < 0.65 ? "🍬" : "👻",
    speed: 2 + Math.random() * 2
  });
}

function loop() {
  if (!running) return;

  frame++;

  if (keys.ArrowLeft || keys.left) player.x -= player.speed;
  if (keys.ArrowRight || keys.right) player.x += player.speed;

  player.x = Math.max(20, Math.min(540, player.x));

  if (frame % 42 === 0) spawnItem();

  for (let i = items.length - 1; i >= 0; i--) {
    const item = items[i];
    item.y += item.speed;

    if (Math.abs(item.x - player.x) < 29 &&
        Math.abs(item.y - player.y) < 27) {
      if (item.type === "🍬") {
        score += 10;
        statusText.textContent = "🍬 Mums! Du hittade godis!";
      } else {
        score = Math.max(0, score - 15);
        statusText.textContent = "👻 Spöket tog 15 poäng!";
      }
      items.splice(i, 1);
      continue;
    }

    if (item.y > 320) items.splice(i, 1);
  }

  draw();
  requestAnimationFrame(loop);
}

document.getElementById("start").addEventListener("click", () => {
  resetGame();
  running = true;
  statusText.textContent = "🎃 Samla godis och akta dig för spöken!";
  loop();
});

document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
});
document.addEventListener("keyup", e => keys[e.key] = false);

function holdButton(id, key) {
  const button = document.getElementById(id);
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    button.addEventListener(event, () => keys[key] = false);
  });
}
holdButton("left", "left");
holdButton("right", "right");

// Skapa egen kuslig musik utan externa ljudfiler
function startMusic() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume();
  musicOn = true;

  const button = document.getElementById("music");
  button.textContent = "🔇 Stäng av musik";

  const melody = [110, 130.81, 98, 146.83, 110, 82.41, 98, 130.81];
  let note = 0;

  function playNote() {
    if (!musicOn) return;

    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "triangle";
    osc.frequency.value = melody[note % melody.length];

    gain.gain.setValueAtTime(0.0001, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.045, audio.currentTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.65);

    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.7);

    note++;
    musicTimer = setTimeout(playNote, 550);
  }
  playNote();
}

document.getElementById("music").addEventListener("click", () => {
  if (musicOn) {
    musicOn = false;
    clearTimeout(musicTimer);
    document.getElementById("music").textContent = "🔊 Starta musik";
  } else {
    startMusic();
  }
});

draw();
</script>
</body>
</html>
